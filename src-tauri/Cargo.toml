[package]
name = "local-transfer-suite"
version = "1.0.1"
description = "本地 OCR + 点对点文件互传（个人/小范围私下使用）"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 移动端要求 cdylib，桌面需要 rlib/staticlib
name = "local_transfer_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"

# 仅 Android 编译：SAF / MediaStore 的 JNI 桥接
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
jni = "0.21"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
