# Render 部署蓝图（免费）：一个 Web Service 同端口托管网页 + 信令
# 在 Render 选择 "New +" → "Blueprint"，连接本仓库即可自动创建，无需手填命令。
services:
  - type: web
    name: mptrace
    runtime: node
    plan: free
    # --include=dev：构建期也安装 vite 等开发依赖（NODE_ENV=production 默认会跳过）
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build:only
    startCommand: node server/signaling.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
