# ============================================================
# Coturn TURN/STUN 服务器配置（极端网络下的中转兜底）
# 路径通常为 /etc/turnserver.conf 或 /etc/coturn/turnserver.conf
# 改完执行：systemctl restart coturn
# ============================================================

# ---- 监听 ----
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# 【必填】VPS 在 NAT 后面时，写服务器公网 IP（云主机一般都需要）
external-ip=YOUR_PUBLIC_IP

# 中继端口范围（UDP），云安全组和防火墙都要放行
min-port=49152
max-port=65535

# ---- 认证 ----
fingerprint
# 长期凭据机制：与 server/.env 里的 TURN_USERNAME / TURN_CREDENTIAL 完全一致
lt-cred-mech
user=lts_friend:change-me-to-a-long-random-secret
realm=turn.example.com

# ---- TLS（turns，推荐）----
# 用 certbot 申请证书后填写
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
no-tlsv1
no-tlsv1_1

# ---- 防滥用：禁止中继访问内网与回环地址（开放中继防护） ----
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
# 小圈子可进一步限定只允许你们的出口公网 IP（可选，按需取消注释）
# allowed-peer-ip=你的家庭宽带公网IP
# allowed-peer-ip=朋友的公网IP

# ---- 日志（只记连接事件，不记录、也无法记录 DTLS 加密后的文件内容） ----
simple-log
log-file=/var/log/coturn/turn.log

# 总带宽/配额可按 VPS 套餐限制（bps），0 为不限
# total-quota=100
# bps-capacity=0
